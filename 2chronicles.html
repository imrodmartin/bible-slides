<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2 Chronicles — Rod Martin · Old Testament Survey</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap');

    :root {
      --font-display: 'Figtree', ui-sans-serif, system-ui, sans-serif;
      --font-text:    'Figtree', ui-sans-serif, system-ui, sans-serif;
      --font-mono:    'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;

      --accent:            #0E7490;  /* light-mode deep teal, theme-aware via JS */
      --accent-on-dark:    #5EC5D6;  /* lightened teal for dark gradients */
      --brand-navy:        #1a2a4f;
      --brand-navy-deep:   #0f1a35;
      --brand-blue:        var(--accent);
      --brand-blue-bright: var(--accent);
      --brand-blue-sky:    #8fd3df;
      --brand-blue-pale:   #d4eef3;

      /* Light mode surfaces */
      --bg:        #f6f5f1;
      --bg-alt:    #ebe9e1;
      --bg-elev:   #ffffff;
      --ink:       #0f1a35;
      --ink-soft:  #34405c;
      --ink-muted: #6b7390;
      --ink-faint: #a8adbf;
      --line:      rgba(15,26,53,0.12);
      --line-soft: rgba(15,26,53,0.06);
      --grid:      rgba(15,26,53,0.04);
      --chip-bg:   rgba(14,116,144,0.08);
      --chip-ink:  #0a5663;

      --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    [data-theme="dark"] {
      --bg:        #0b1226;
      --bg-alt:    #141c36;
      --bg-elev:   #1a2444;
      --ink:       #f2f3f8;
      --ink-soft:  #d8dceb;
      --ink-muted: #a8aec8;
      --ink-faint: #7a819e;
      --line:      rgba(255,255,255,0.16);
      --line-soft: rgba(255,255,255,0.08);
      --grid:      rgba(255,255,255,0.05);
      --chip-bg:   rgba(94,197,214,0.14);
      --chip-ink:  #5EC5D6;
      --brand-blue-sky:    #5EC5D6;
    }

    html, body { margin:0;padding:0;background:#000;font-family:var(--font-text);-webkit-font-smoothing:antialiased; }
    * { box-sizing: border-box; }

    .slide {
      width:1920px;height:1080px;background:var(--bg);color:var(--ink);
      position:relative;overflow:hidden;font-family:var(--font-text);display:flex;flex-direction:column;
    }
    .grid-bg {
      position:absolute;inset:0;
      background-image:linear-gradient(to right,var(--grid) 1px,transparent 1px),linear-gradient(to bottom,var(--grid) 1px,transparent 1px);
      background-size:80px 80px;pointer-events:none;
    }
    .pad { padding:88px 120px;flex:1;display:flex;flex-direction:column;position:relative;z-index:2; }
    .slide-header { display:flex;justify-content:space-between;align-items:center;padding:48px 72px 0;font-size:24px;font-weight:500;color:var(--ink-muted);letter-spacing:.02em;position:relative;z-index:3; }
    .slide-footer { display:flex;justify-content:space-between;align-items:center;padding:0 72px 48px;font-family:var(--font-mono);font-size:24px;color:var(--ink-muted);letter-spacing:.04em;position:relative;z-index:3; }

    /* Type scale */
    .eyebrow { font-family:var(--font-mono);font-size:24px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);display:inline-flex;align-items:center;gap:14px; }
    .eyebrow::before { content:'';width:36px;height:2px;background:currentColor; }
    .kicker { font-family:var(--font-mono);font-size:24px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-muted); }
    h1.display { font-family:var(--font-display);font-size:160px;font-weight:800;line-height:.96;letter-spacing:-.035em;margin:0;color:var(--ink); }
    h2.section { font-family:var(--font-display);font-size:96px;font-weight:800;line-height:1.0;letter-spacing:-.025em;margin:0; }
    .lead { font-family:var(--font-display);font-size:40px;line-height:1.35;font-weight:400;color:var(--ink-soft);margin:0; }
    .body { font-family:var(--font-text);font-size:28px;line-height:1.5;color:var(--ink-soft);margin:0; }
    .quote-giant { font-family:var(--font-display);font-size:120px;font-weight:700;line-height:1.04;letter-spacing:-.03em;color:var(--ink);margin:0; }
    .accent { color:var(--accent); }
    .muted  { color:var(--ink-muted); }
    .chip { display:inline-flex;align-items:center;gap:10px;padding:10px 20px;background:var(--chip-bg);color:var(--chip-ink);border-radius:999px;font-family:var(--font-mono);font-size:18px;font-weight:600;letter-spacing:.04em; }
    .card { background:var(--bg-elev);border:1px solid var(--line);border-radius:28px;padding:56px;position:relative; }
    .logo-mark { height:44px;display:block; }
    [data-theme="dark"] .logo-mark.inverted { filter:brightness(0) invert(1); }
    .flex-row { display:flex; }
    .flex-col { display:flex;flex-direction:column; }
    .gap-m { gap:32px; }
    .gap-l { gap:56px; }
    .gap-xl { gap:80px; }
    .grow { flex:1; }
    .center { display:flex;align-items:center;justify-content:center; }

    /* Defensive: ensure in-slide links are clickable above tapzones */
    .slide a { pointer-events: auto !important; cursor: pointer; position: relative; z-index: 10; }

    /* Theme toggle + tweaks panel */
    .theme-toggle { position:fixed;top:20px;right:20px;z-index:2147482500;display:inline-flex;align-items:center;gap:6px;padding:6px;background:rgba(0,0,0,.6);backdrop-filter:blur(12px);border-radius:999px;border:1px solid rgba(255,255,255,.1); }
    .theme-toggle button { appearance:none;border:0;background:transparent;color:rgba(255,255,255,.6);padding:8px 14px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.05em;cursor:pointer;transition:all 140ms; }
    .theme-toggle button.active { background:rgba(255,255,255,.15);color:#fff; }
    .theme-toggle #btn-filmstrip { padding:8px 10px;display:inline-flex;align-items:center;justify-content:center; }
    .tweaks-panel { position:fixed;bottom:80px;right:20px;z-index:2147482400;width:280px;background:rgba(15,20,40,.92);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:20px;color:#fff;display:none;box-shadow:0 20px 60px rgba(0,0,0,.4); }
    .tweaks-panel[data-visible] { display:block; }
    .tweaks-panel h4 { margin:0 0 16px;font-size:12px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.6); }
    .tweaks-row { display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:13px; }
    .tweaks-row .seg { display:inline-flex;background:rgba(255,255,255,.08);border-radius:8px;padding:2px; }
    .tweaks-row .seg button { appearance:none;border:0;background:transparent;color:rgba(255,255,255,.7);padding:6px 12px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer; }
    .tweaks-row .seg button.active { background:rgba(255,255,255,.15);color:#fff; }
  </style>
</head>
<body>

  <!-- Light/Dark toggle + filmstrip button -->
  <div class="theme-toggle" id="theme-toggle">
    <button data-theme-set="light" class="active">☀ Light</button>
    <button data-theme-set="dark">☾ Dark</button>
    <button id="btn-filmstrip" title="All slides (G)" aria-label="All slides">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="1.5" y="1.5" width="5" height="5" rx="1"></rect><rect x="9.5" y="1.5" width="5" height="5" rx="1"></rect>
        <rect x="1.5" y="9.5" width="5" height="5" rx="1"></rect><rect x="9.5" y="9.5" width="5" height="5" rx="1"></rect>
      </svg>
    </button>
  </div>

  <!-- Tweaks panel (accent fixed for WCAG; theme/grid/density adjustable) -->
  <div class="tweaks-panel" id="tweaks-panel">
    <h4>Tweaks</h4>
    <div class="tweaks-row">
      <span>Theme</span>
      <div class="seg" id="tw-theme">
        <button data-theme-set="light" class="active">Light</button>
        <button data-theme-set="dark">Dark</button>
      </div>
    </div>
    <div class="tweaks-row">
      <span>Grid</span>
      <div class="seg" id="tw-grid">
        <button data-grid="on" class="active">On</button>
        <button data-grid="off">Off</button>
      </div>
    </div>
    <div class="tweaks-row">
      <span>Density</span>
      <div class="seg" id="tw-density">
        <button data-density="tight">Tight</button>
        <button data-density="default" class="active">Default</button>
      </div>
    </div>
  </div>

  <!-- Deck: one <section> per slide -->
  <deck-stage width="1920" height="1080" id="deck">
    <section id="s01"></section>
    <section id="s02"></section>
    <section id="s03"></section>
    <section id="s04"></section>
    <section id="s05"></section>
    <section id="s06"></section>
    <section id="s07"></section>
    <section id="s08"></section>
    <section id="s09"></section>
    <section id="s10"></section>
    <section id="s11"></section>
    <section id="s12"></section>
    <section id="s13"></section>
    <section id="s14"></section>
    <section id="s15"></section>
    <section id="s16"></section>
    <section id="s17"></section>
    <section id="s18"></section>
    <section id="s19"></section>
    <section id="s20"></section>
    <section id="s21"></section>
    <section id="s22"></section>
    <section id="s23"></section>
    <section id="s24"></section>
    <section id="s25"></section>
    <section id="s26"></section>
  </deck-stage>

  <!-- [1] deck-stage web component -->
  <script>
  (() => {
    const DESIGN_W_DEFAULT = 1920;
    const DESIGN_H_DEFAULT = 1080;
    const STORAGE_PREFIX = 'deck-stage:slide:';
    const OVERLAY_HIDE_MS = 1800;
    const VALIDATE_ATTR = 'no_overflowing_text,no_overlapping_text,slide_sized_text';
    const pad2 = (n) => String(n).padStart(2, '0');

    const stylesheet = `
      :host { position:fixed;inset:0;display:block;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;overflow:hidden; }
      .stage { position:absolute;inset:0;display:flex;align-items:center;justify-content:center; }
      .canvas { position:relative;transform-origin:center center;flex-shrink:0;background:#fff;will-change:transform; }
      ::slotted(*) { position:absolute!important;inset:0!important;width:100%!important;height:100%!important;box-sizing:border-box!important;overflow:hidden;opacity:0;pointer-events:none;visibility:hidden; }
      ::slotted([data-deck-active]) { opacity:1;pointer-events:auto;visibility:visible; }
      .tapzones { position:fixed;inset:0;display:flex;z-index:2147482000;pointer-events:none; }
      .tapzone { flex:1;pointer-events:auto;-webkit-tap-highlight-color:transparent; }
      @media (hover:hover) and (pointer:fine) { .tapzones { display:none; } }
      .overlay { position:fixed;left:50%;bottom:22px;transform:translate(-50%,6px) scale(0.92);filter:blur(6px);display:flex;align-items:center;gap:4px;padding:4px;background:#000;color:#fff;border-radius:999px;font-size:12px;font-feature-settings:"tnum" 1;letter-spacing:.01em;opacity:0;pointer-events:none;transition:opacity 260ms ease,transform 260ms cubic-bezier(.2,.8,.2,1),filter 260ms ease;transform-origin:center bottom;z-index:2147483000;user-select:none; }
      .overlay[data-visible] { opacity:1;pointer-events:auto;transform:translate(-50%,0) scale(1);filter:blur(0); }
      .btn { appearance:none;-webkit-appearance:none;background:transparent;border:0;margin:0;padding:0;color:inherit;font:inherit;cursor:default;display:inline-flex;align-items:center;justify-content:center;height:28px;min-width:28px;border-radius:999px;color:rgba(255,255,255,.72);transition:background 140ms ease,color 140ms ease;-webkit-tap-highlight-color:transparent; }
      .btn:hover { background:rgba(255,255,255,.12);color:#fff; }
      .btn:active { background:rgba(255,255,255,.18); }
      .btn svg { width:14px;height:14px;display:block; }
      .btn.reset { font-size:11px;font-weight:500;letter-spacing:.02em;padding:0 10px 0 12px;gap:6px; }
      .btn.reset .kbd { display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 4px;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:10px;line-height:1;color:rgba(255,255,255,.88);background:rgba(255,255,255,.12);border-radius:4px; }
      .count { font-variant-numeric:tabular-nums;color:#fff;font-weight:500;padding:0 8px;min-width:42px;text-align:center;font-size:12px; }
      .count .sep { color:rgba(255,255,255,.45);margin:0 3px;font-weight:400; }
      .count .total { color:rgba(255,255,255,.55); }
      .divider { width:1px;height:14px;background:rgba(255,255,255,.18);margin:0 2px; }
      @media print { :host { position:static;inset:auto;background:none;overflow:visible;color:inherit; } .stage { position:static;display:block; } .canvas { transform:none!important;width:auto!important;height:auto!important;background:none;will-change:auto; } ::slotted(*) { position:relative!important;inset:auto!important;width:var(--deck-design-w)!important;height:var(--deck-design-h)!important;box-sizing:border-box!important;opacity:1!important;visibility:visible!important;pointer-events:auto;break-after:page;page-break-after:always;break-inside:avoid;overflow:hidden; } ::slotted(*:last-child) { break-after:auto;page-break-after:auto; } .overlay,.tapzones { display:none!important; } }
    `;

    class DeckStage extends HTMLElement {
      static get observedAttributes() { return ['width','height','noscale']; }
      constructor() {
        super();
        this._root=this.attachShadow({mode:'open'});
        this._index=0;this._slides=[];this._notes=[];
        this._hideTimer=null;this._mouseIdleTimer=null;
        this._storageKey=STORAGE_PREFIX+(location.pathname||'/');
        this._onKey=this._onKey.bind(this);
        this._onResize=this._onResize.bind(this);
        this._onSlotChange=this._onSlotChange.bind(this);
        this._onMouseMove=this._onMouseMove.bind(this);
        this._onTapBack=this._onTapBack.bind(this);
        this._onTapForward=this._onTapForward.bind(this);
      }
      get designWidth()  { return parseInt(this.getAttribute('width'),10)||DESIGN_W_DEFAULT; }
      get designHeight() { return parseInt(this.getAttribute('height'),10)||DESIGN_H_DEFAULT; }
      connectedCallback() {
        this._render();this._loadNotes();this._syncPrintPageRule();
        window.addEventListener('keydown',this._onKey);
        window.addEventListener('resize',this._onResize);
        window.addEventListener('mousemove',this._onMouseMove,{passive:true});
      }
      disconnectedCallback() {
        window.removeEventListener('keydown',this._onKey);
        window.removeEventListener('resize',this._onResize);
        window.removeEventListener('mousemove',this._onMouseMove);
        if(this._hideTimer) clearTimeout(this._hideTimer);
        if(this._mouseIdleTimer) clearTimeout(this._mouseIdleTimer);
      }
      attributeChangedCallback() {
        if(this._canvas){
          this._canvas.style.width=this.designWidth+'px';
          this._canvas.style.height=this.designHeight+'px';
          this._canvas.style.setProperty('--deck-design-w',this.designWidth+'px');
          this._canvas.style.setProperty('--deck-design-h',this.designHeight+'px');
          this._fit();this._syncPrintPageRule();
        }
      }
      _render() {
        const style=document.createElement('style');style.textContent=stylesheet;
        const stage=document.createElement('div');stage.className='stage';
        const canvas=document.createElement('div');canvas.className='canvas';
        canvas.style.width=this.designWidth+'px';canvas.style.height=this.designHeight+'px';
        canvas.style.setProperty('--deck-design-w',this.designWidth+'px');
        canvas.style.setProperty('--deck-design-h',this.designHeight+'px');
        const slot=document.createElement('slot');
        slot.addEventListener('slotchange',this._onSlotChange);
        canvas.appendChild(slot);stage.appendChild(canvas);
        const tapzones=document.createElement('div');tapzones.className='tapzones';tapzones.setAttribute('aria-hidden','true');
        const tzBack=document.createElement('div');tzBack.className='tapzone tapzone--back';
        const tzMid=document.createElement('div');tzMid.className='tapzone tapzone--mid';tzMid.style.pointerEvents='none';
        const tzFwd=document.createElement('div');tzFwd.className='tapzone tapzone--fwd';
        tzBack.addEventListener('click',this._onTapBack);tzFwd.addEventListener('click',this._onTapForward);
        tapzones.append(tzBack,tzMid,tzFwd);
        const overlay=document.createElement('div');
        overlay.className='overlay';overlay.setAttribute('role','toolbar');overlay.setAttribute('aria-label','Deck controls');
        overlay.innerHTML=`<button class="btn prev" type="button" aria-label="Previous slide" title="Previous (←)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"/></svg></button><span class="count" aria-live="polite"><span class="current">1</span><span class="sep">/</span><span class="total">1</span></span><button class="btn next" type="button" aria-label="Next slide" title="Next (→)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg></button><span class="divider"></span><button class="btn reset" type="button" aria-label="Reset to first slide" title="Reset (R)">Reset<span class="kbd">R</span></button><span class="divider"></span><button class="btn grid-toggle" type="button" aria-label="All slides" title="All slides (G)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="1.5" width="5" height="5" rx="1"/><rect x="9.5" y="1.5" width="5" height="5" rx="1"/><rect x="1.5" y="9.5" width="5" height="5" rx="1"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/></svg></button>`;
        overlay.querySelector('.prev').addEventListener('click',()=>this._go(this._index-1,'click'));
        overlay.querySelector('.next').addEventListener('click',()=>this._go(this._index+1,'click'));
        overlay.querySelector('.reset').addEventListener('click',()=>this._go(0,'click'));
        overlay.querySelector('.grid-toggle').addEventListener('click',()=>this.toggleFilmstrip());
        this._root.append(style,stage,tapzones,overlay);
        this._canvas=canvas;this._slot=slot;this._overlay=overlay;
        this._countEl=overlay.querySelector('.current');this._totalEl=overlay.querySelector('.total');
      }
      _syncPrintPageRule() {
        const id='deck-stage-print-page';let tag=document.getElementById(id);
        if(!tag){tag=document.createElement('style');tag.id=id;document.head.appendChild(tag);}
        tag.textContent='@page{size:'+this.designWidth+'px '+this.designHeight+'px;margin:0}@media print{html,body{margin:0!important;padding:0!important;background:none!important;overflow:visible!important;height:auto!important}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}';
      }
      _onSlotChange(){this._collectSlides();this._restoreIndex();this._applyIndex({showOverlay:false,broadcast:true,reason:'init'});this._fit();}
      _collectSlides(){
        const assigned=this._slot.assignedElements({flatten:true});
        this._slides=assigned.filter(el=>{const t=el.tagName;return t!=='TEMPLATE'&&t!=='SCRIPT'&&t!=='STYLE';});
        this._slides.forEach((slide,i)=>{
          const n=i+1;let label=slide.getAttribute('data-label');
          if(!label){const h=slide.querySelector('h1,h2,h3,[data-title]');if(h)label=(h.textContent||'').trim().slice(0,40);}
          if(!label)label='Slide';
          slide.setAttribute('data-screen-label',`${pad2(n)} ${label}`);
          if(!slide.hasAttribute('data-om-validate'))slide.setAttribute('data-om-validate',VALIDATE_ATTR);
          slide.setAttribute('data-deck-slide',String(i));
        });
        if(this._totalEl)this._totalEl.textContent=String(this._slides.length||1);
        if(this._index>=this._slides.length)this._index=Math.max(0,this._slides.length-1);
      }
      _loadNotes(){const tag=document.getElementById('speaker-notes');if(!tag){this._notes=[];return;}try{const p=JSON.parse(tag.textContent||'[]');if(Array.isArray(p))this._notes=p;}catch(e){this._notes=[];}}
      _restoreIndex(){try{const raw=localStorage.getItem(this._storageKey);if(raw!=null){const n=parseInt(raw,10);if(Number.isFinite(n)&&n>=0&&n<this._slides.length)this._index=n;}}catch(e){}}
      _persistIndex(){try{localStorage.setItem(this._storageKey,String(this._index));}catch(e){}}
      _applyIndex({showOverlay=true,broadcast=true,reason='init'}={}){
        if(!this._slides.length)return;
        const curr=this._index;
        this._slides.forEach((s,i)=>{if(i===curr)s.setAttribute('data-deck-active','');else s.removeAttribute('data-deck-active');});
        if(this._countEl)this._countEl.textContent=String(curr+1);
        this._persistIndex();
        if(broadcast){try{window.postMessage({slideIndexChanged:curr},'*');}catch(e){}
          this.dispatchEvent(new CustomEvent('slidechange',{detail:{index:curr,total:this._slides.length},bubbles:true,composed:true}));}
        if(showOverlay)this._flashOverlay();
        this._syncFilmstripActive();
      }
      _flashOverlay(){if(!this._overlay)return;this._overlay.setAttribute('data-visible','');if(this._hideTimer)clearTimeout(this._hideTimer);this._hideTimer=setTimeout(()=>this._overlay.removeAttribute('data-visible'),OVERLAY_HIDE_MS);}
      _fit(){if(!this._canvas)return;if(this.hasAttribute('noscale')){this._canvas.style.transform='none';return;}const s=Math.min(window.innerWidth/this.designWidth,window.innerHeight/this.designHeight);this._canvas.style.transform=`scale(${s})`;}
      _onResize(){this._fit();}
      _onMouseMove(){this._flashOverlay();}
      _onTapBack(e){e.preventDefault();this._go(this._index-1,'tap');}
      _onTapForward(e){e.preventDefault();this._go(this._index+1,'tap');}
      _onKey(e){
        const t=e.target;if(t&&(t.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)))return;
        if(e.metaKey||e.ctrlKey||e.altKey)return;
        const key=e.key;let handled=true;
        if(key==='ArrowRight'||key==='PageDown'||key===' '||key==='Spacebar')this._go(this._index+1,'keyboard');
        else if(key==='ArrowLeft'||key==='PageUp')this._go(this._index-1,'keyboard');
        else if(key==='Home')this._go(0,'keyboard');
        else if(key==='End')this._go(this._slides.length-1,'keyboard');
        else if(key==='r'||key==='R')this._go(0,'keyboard');

  <!-- [7] Theme + tweaks controller -->
  <script>
    // Disable shadow-DOM tapzones so mouse clicks reach links in slides.
    (function disableTapzones() {
      function inject() {
        const deck = document.getElementById('deck');
        if (deck && deck.shadowRoot) {
          const s = document.createElement('style');
          s.textContent = '.tapzones { display: none !important; }';
          deck.shadowRoot.appendChild(s);
        }
      }
      if (document.readyState === 'complete') { inject(); }
      else { window.addEventListener('load', inject); }
      setTimeout(inject, 500);
    })();

    const html = document.documentElement;

    // Theme-aware accent: keep WCAG-safe on both light and dark surfaces.
    function applyAccent() {
      const dark = html.getAttribute('data-theme') === 'dark';
      const c = dark ? ACCENT_DARK : ACCENT_COLOR;
      html.style.setProperty('--accent', c);
      html.style.setProperty('--brand-blue-bright', c);
      html.style.setProperty('--brand-blue', c);
    }

    const savedTheme = localStorage.getItem('deck:theme') || 'light';
    html.setAttribute('data-theme', savedTheme);
    applyAccent();

    function syncThemeButtons(theme) {
      document.querySelectorAll('[data-theme-set]').forEach(b => b.classList.toggle('active', b.dataset.themeSet === theme));
    }
    syncThemeButtons(savedTheme);
    document.querySelectorAll('[data-theme-set]').forEach(b => {
      b.addEventListener('click', () => { const t = b.dataset.themeSet; html.setAttribute('data-theme', t); localStorage.setItem('deck:theme', t); syncThemeButtons(t); applyAccent(); });
    });

    function applyGrid(state) {
      document.querySelectorAll('.grid-bg').forEach(el => el.style.display = state === 'off' ? 'none' : '');
      document.querySelectorAll('#tw-grid button').forEach(b => b.classList.toggle('active', b.dataset.grid === state));
    }
    const savedGrid = localStorage.getItem('deck:grid') || 'on';
    setTimeout(() => applyGrid(savedGrid), 400);
    document.querySelectorAll('#tw-grid button').forEach(b => {
      b.addEventListener('click', () => { const s = b.dataset.grid; localStorage.setItem('deck:grid', s); applyGrid(s); });
    });

    function applyDensity(state) {
      if (state === 'tight') document.querySelectorAll('.pad').forEach(el => el.style.padding = '64px 96px');
      else document.querySelectorAll('.pad').forEach(el => el.style.padding = '');
      document.querySelectorAll('#tw-density button').forEach(b => b.classList.toggle('active', b.dataset.density === state));
    }
    const savedDensity = localStorage.getItem('deck:density') || 'default';
    setTimeout(() => applyDensity(savedDensity), 400);
    document.querySelectorAll('#tw-density button').forEach(b => {
      b.addEventListener('click', () => { const s = b.dataset.density; localStorage.setItem('deck:density', s); applyDensity(s); });
    });

    document.getElementById('btn-filmstrip').addEventListener('click', () => document.getElementById('deck').toggleFilmstrip());

    const panel = document.getElementById('tweaks-panel');
    window.addEventListener('message', (e) => {
      if (!e.data || typeof e.data !== 'object') return;
      if (e.data.type === '__activate_edit_mode')   panel.setAttribute('data-visible', '');
      if (e.data.type === '__deactivate_edit_mode') panel.removeAttribute('data-visible');
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 't' || e.key === 'T') {
        if (panel.hasAttribute('data-visible')) panel.removeAttribute('data-visible');
        else panel.setAttribute('data-visible', '');
      }
    });
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
  </script>
