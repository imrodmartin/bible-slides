<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ephesians — Rod Martin · Bible Study</title>

      --light:#F2F2F2;

      --navy:#1C0A10;

      --ink-1:#1A1A1A;
      --ink-2:#444444;
      --ink-3:#606060;
      --border-c:#CCCCCC;
      --band-mid:#FFFFFF;
      --ghost-text:rgba(0,0,0,0.08);

      --accent-fg:#7B2D3E;
    }
    [data-theme="dark"] {
      --light:#1E1218;
      --ink-1:#F0E6E0;
      --ink-2:#C4B0A8;
      --ink-3:#9E8C84;
      --border-c:#3D2830;
      --band-mid:#2A1820;
      --ghost-text:rgba(255,255,255,0.08);
      /* #7B2D3E on #1E1218 = 2.3:1 FAIL — swap to gold (#C4A882 = ~8.5:1) for all text uses */
      --accent-fg:#C4A882;
    }
    .pill{display:inline-flex;align-items:center;gap:10px;padding:12px 24px;background:var(--dark);color:var(--white);border-radius:999px;font-family:var(--font-body);font-size:22px;font-weight:500;letter-spacing:.02em;white-space:nowrap;}

    .theme-toggle button.active{background:rgba(255,255,255,.15);color:#fff;}
    .theme-toggle #btn-filmstrip{padding:8px 10px;display:inline-flex;align-items:center;justify-content:center;}
    .tweaks-panel{position:fixed;bottom:80px;right:20px;z-index:2147482400;width:280px;background:rgba(15,20,40,.92);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:20px;color:#fff;display:none;box-shadow:0 20px 60px rgba(0,0,0,.4);}

</head>

</div>

</div>

<!-- [7] Theme + Tweaks controller -->
<script>
const html=document.documentElement;
const savedTheme=localStorage.getItem('deck:theme')||'light';
html.setAttribute('data-theme',savedTheme);
function syncThemeButtons(t){document.querySelectorAll('[data-theme-set]').forEach(b=>b.classList.toggle('active',b.dataset.themeSet===t));}
syncThemeButtons(savedTheme);
document.querySelectorAll('[data-theme-set]').forEach(b=>{b.addEventListener('click',()=>{const t=b.dataset.themeSet;html.setAttribute('data-theme',t);localStorage.setItem('deck:theme',t);syncThemeButtons(t);});});

function applyAccent(color){html.style.setProperty('--accent',color);html.style.setProperty('--brand-blue-bright',color);html.style.setProperty('--brand-blue',color);document.querySelectorAll('#tw-accent .sw').forEach(el=>el.classList.toggle('active',el.dataset.accent===color));}
const savedAccent=localStorage.getItem('deck:accent')||ACCENT_COLOR;
applyAccent(savedAccent);
document.querySelectorAll('#tw-accent .sw').forEach(el=>{el.addEventListener('click',()=>{const c=el.dataset.accent;localStorage.setItem('deck:accent',c);applyAccent(c);});});

function applyDensity(state){if(state==='tight')document.querySelectorAll('.pad').forEach(el=>el.style.padding='64px 96px');else document.querySelectorAll('.pad').forEach(el=>el.style.padding='');document.querySelectorAll('#tw-density button').forEach(b=>b.classList.toggle('active',b.dataset.density===state));}
const savedDensity=localStorage.getItem('deck:density')||'default';
setTimeout(()=>applyDensity(savedDensity),400);
document.querySelectorAll('#tw-density button').forEach(b=>{b.addEventListener('click',()=>{const s=b.dataset.density;localStorage.setItem('deck:density',s);applyDensity(s);});});

document.getElementById('btn-filmstrip').addEventListener('click',()=>document.getElementById('deck').toggleFilmstrip());

const panel=document.getElementById('tweaks-panel');
window.addEventListener('message',(e)=>{if(!e.data||typeof e.data!=='object')return;if(e.data.type==='__activate_edit_mode')panel.setAttribute('data-visible','');if(e.data.type==='__deactivate_edit_mode')panel.removeAttribute('data-visible');});
document.addEventListener('keydown',(e)=>{if(e.key==='t'||e.key==='T'){if(panel.hasAttribute('data-visible'))panel.removeAttribute('data-visible');else panel.setAttribute('data-visible','');}});
window.parent.postMessage({type:'__edit_mode_available'},'*');
</script>
