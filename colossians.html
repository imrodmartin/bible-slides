<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Book of Colossians — Rod Martin</title>
  <style>
@import url('https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&family=Lora:ital,wght@0,400;0,600;1,400;1,600&display=swap');
:root {
  --font-display:'Figtree',ui-sans-serif,system-ui,sans-serif;
  --font-text:'Figtree',ui-sans-serif,system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
  --font-serif:'Lora',Georgia,serif;
  --brand-navy:#1e2d52; --brand-navy-deep:#0f1a35;
  --brand-gold:#8a6520; --brand-gold-bright:#c9973a;
  --brand-gold-light:#e8c97a; --brand-gold-pale:#f5edda;
  --navy-fixed:#1e2d52; --navy-deep-fixed:#0f1a35;
  --gold-fixed:#8a6520; --gold-bright-fixed:#c9973a;
  --bg:#f8f6f1; --bg-alt:#ede8df; --bg-elev:#ffffff;
  --ink:#0f1a35; --ink-soft:#2d3a5c; --ink-muted:#6b7390; --ink-faint:#a8adbf;
  --line:rgba(15,26,53,0.12); --line-soft:rgba(15,26,53,0.06);
  --grid:rgba(15,26,53,0.035);
  --hero-tint:var(--brand-gold-pale);
  --ease-out:cubic-bezier(0.2,0.8,0.2,1);
}
[data-theme="dark"] {
  --bg:#111827; --bg-alt:#1a2235; --bg-elev:#1f2a3f;
  --ink:#f2f3f8; --ink-soft:#d8dceb; --ink-muted:#a8aec8; --ink-faint:#7a819e;
  --line:rgba(255,255,255,0.16); --line-soft:rgba(255,255,255,0.08);
  --grid:rgba(255,255,255,0.05);
  --brand-gold:#e8c97a; --brand-gold-bright:#e8c97a;
  /* Gold cards get a dark gold tint so light ink stays readable */
  --brand-gold-pale:rgba(201,151,58,0.14); --brand-gold-light:rgba(201,151,58,0.22);
}
html,body{margin:0;padding:0;background:#000;font-family:var(--font-text);color:var(--ink);-webkit-font-smoothing:antialiased;}
*{box-sizing:border-box;}
.slide{width:1920px;height:1080px;background:var(--bg);color:var(--ink);position:relative;overflow:hidden;font-family:var(--font-text);display:flex;flex-direction:column;}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(to right,var(--grid) 1px,transparent 1px),linear-gradient(to bottom,var(--grid) 1px,transparent 1px);background-size:80px 80px;pointer-events:none;}
.pad{padding:72px 110px;flex:1;display:flex;flex-direction:column;position:relative;z-index:2;}
.slide-header{display:flex;justify-content:space-between;align-items:center;padding:40px 72px 0;font-size:22px;font-weight:500;color:var(--ink-muted);position:relative;z-index:3;}
.slide-footer{display:flex;justify-content:space-between;align-items:center;padding:0 72px 40px;font-family:var(--font-mono);font-size:20px;color:var(--ink-muted);letter-spacing:0.04em;position:relative;z-index:3;}
.eyebrow{font-family:var(--font-mono);font-size:22px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:var(--brand-gold-bright);display:inline-flex;align-items:center;gap:14px;}
.eyebrow::before{content:'';width:32px;height:2px;background:currentColor;}
.kicker{font-family:var(--font-mono);font-size:20px;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;color:var(--ink-muted);}
h2.section{font-family:var(--font-display);font-size:88px;font-weight:800;line-height:1.0;letter-spacing:-0.025em;margin:0;text-wrap:balance;}
.lead{font-family:var(--font-display);font-size:36px;line-height:1.35;font-weight:400;color:var(--ink-soft);margin:0;text-wrap:pretty;}
.scripture{font-family:var(--font-serif);font-size:46px;line-height:1.45;font-weight:400;color:var(--ink);font-style:italic;margin:0;}
.scripture-ref{font-family:var(--font-mono);font-size:22px;font-weight:600;letter-spacing:0.14em;color:var(--brand-gold-bright);text-transform:uppercase;}

/* Theme toggle */
.theme-toggle{position:fixed;top:20px;right:20px;z-index:2147482500;display:inline-flex;align-items:center;gap:6px;padding:6px;background:rgba(0,0,0,0.6);backdrop-filter:blur(12px);border-radius:999px;border:1px solid rgba(255,255,255,0.1);}
.theme-toggle button{appearance:none;border:0;background:transparent;color:rgba(255,255,255,0.6);padding:8px 14px;border-radius:999px;font-family:var(--font-text);font-size:12px;font-weight:600;letter-spacing:0.05em;cursor:pointer;transition:all 140ms;}
.theme-toggle button.active{background:rgba(255,255,255,0.15);color:#fff;}
.theme-toggle #btn-filmstrip{padding:8px 10px;display:inline-flex;align-items:center;justify-content:center;}
  </style>
</head>
<body>

<div class="theme-toggle" id="theme-toggle">
  <button data-theme-set="light" class="active">☀ Light</button>
  <button data-theme-set="dark">☾ Dark</button>
  <button id="btn-filmstrip" title="All slides (G)" aria-label="All slides">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1.5" y="1.5" width="5" height="5" rx="1"/><rect x="9.5" y="1.5" width="5" height="5" rx="1"/>
      <rect x="1.5" y="9.5" width="5" height="5" rx="1"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/>
    </svg>
  </button>
</div>

<deck-stage width="1920" height="1080" id="deck">
  <section id="s01"></section><section id="s02"></section><section id="s03"></section>
  <section id="s04"></section><section id="s05"></section><section id="s06"></section>
  <section id="s07"></section><section id="s08"></section><section id="s09"></section>
  <section id="s10"></section><section id="s11"></section><section id="s12"></section>
  <section id="s13"></section><section id="s14"></section><section id="s15"></section>
  <section id="s16"></section><section id="s17"></section><section id="s18"></section>
</deck-stage>

<!-- Full deck-stage web component -->
<script>
(() => {
  const DESIGN_W_DEFAULT = 1920, DESIGN_H_DEFAULT = 1080;
  const STORAGE_PREFIX = 'deck-stage:slide:', OVERLAY_HIDE_MS = 1800;
  const pad2 = n => String(n).padStart(2, '0');

  const stylesheet = `
    :host { position:fixed;inset:0;display:block;background:#000;overflow:hidden; }
    .stage { position:absolute;inset:0;display:flex;align-items:center;justify-content:center; }
    .canvas { position:relative;transform-origin:center center;flex-shrink:0;background:#fff;will-change:transform; }
    ::slotted(*) { position:absolute!important;inset:0!important;width:100%!important;height:100%!important;box-sizing:border-box!important;overflow:hidden;opacity:0;pointer-events:none;visibility:hidden; }
    ::slotted([data-deck-active]) { opacity:1;pointer-events:auto;visibility:visible; }
    .tapzones { position:fixed;inset:0;display:flex;z-index:2147482000;pointer-events:none; }
    .tapzone { flex:1;pointer-events:auto;-webkit-tap-highlight-color:transparent; }
    @media (hover:hover) and (pointer:fine) { .tapzones { display:none; } }
    .overlay { position:fixed;left:50%;bottom:22px;transform:translate(-50%,6px) scale(0.92);filter:blur(6px);display:flex;align-items:center;gap:4px;padding:4px;background:#000;color:#fff;border-radius:999px;font-size:12px;opacity:0;pointer-events:none;transition:opacity 260ms ease,transform 260ms cubic-bezier(.2,.8,.2,1),filter 260ms ease;transform-origin:center bottom;z-index:2147483000;user-select:none; }
    .overlay[data-visible] { opacity:1;pointer-events:auto;transform:translate(-50%,0) scale(1);filter:blur(0); }
    .btn { appearance:none;-webkit-appearance:none;background:transparent;border:0;margin:0;padding:0;color:rgba(255,255,255,0.72);font:inherit;cursor:default;display:inline-flex;align-items:center;justify-content:center;height:28px;min-width:28px;border-radius:999px;transition:background 140ms,color 140ms;-webkit-tap-highlight-color:transparent; }
    .btn:hover { background:rgba(255,255,255,0.12);color:#fff; }
    .btn svg { width:14px;height:14px;display:block; }
    .btn.reset { font-size:11px;font-weight:500;letter-spacing:0.02em;padding:0 10px 0 12px;gap:6px; }
    .btn.reset .kbd { display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 4px;font-family:ui-monospace,monospace;font-size:10px;color:rgba(255,255,255,0.88);background:rgba(255,255,255,0.12);border-radius:4px; }
    .count { font-variant-numeric:tabular-nums;color:#fff;font-weight:500;padding:0 8px;min-width:42px;text-align:center;font-size:12px; }
    .count .sep { color:rgba(255,255,255,0.45);margin:0 3px; }
    .count .total { color:rgba(255,255,255,0.55); }
    .divider { width:1px;height:14px;background:rgba(255,255,255,0.18);margin:0 2px; }
    @media print {
      :host { position:static;inset:auto;background:none;overflow:visible; }
      .stage { position:static;display:block; }
      .canvas { transform:none!important;width:auto!important;height:auto!important;background:none;will-change:auto; }
      ::slotted(*) { position:relative!important;inset:auto!important;width:var(--deck-design-w)!important;height:var(--deck-design-h)!important;opacity:1!important;visibility:visible!important;pointer-events:auto;break-after:page;page-break-after:always;break-inside:avoid;overflow:hidden; }
      ::slotted(*:last-child) { break-after:auto;page-break-after:auto; }
      .overlay,.tapzones { display:none!important; }
    }
  `;

  class DeckStage extends HTMLElement {
    static get observedAttributes() { return ['width','height','noscale']; }
    constructor() {
      super();
      this._root = this.attachShadow({ mode:'open' });
      this._index = 0; this._slides = [];
      this._hideTimer = null;
      this._storageKey = STORAGE_PREFIX + (location.pathname || '/');
      this._onKey = this._onKey.bind(this);
      this._onResize = this._onResize.bind(this);
      this._onSlotChange = this._onSlotChange.bind(this);
      this._onMouseMove = this._onMouseMove.bind(this);
    }
    get designWidth()  { return parseInt(this.getAttribute('width'),  10) || DESIGN_W_DEFAULT; }
    get designHeight() { return parseInt(this.getAttribute('height'), 10) || DESIGN_H_DEFAULT; }

    connectedCallback() {
      this._render();
      this._syncPrintPageRule();
      window.addEventListener('keydown',  this._onKey);
      window.addEventListener('resize',   this._onResize);
      window.addEventListener('mousemove',this._onMouseMove, { passive:true });
      // Fit on connect AND after a short delay to catch React mount
      this._fit();
      setTimeout(() => this._fit(), 200);
      setTimeout(() => this._fit(), 600);
    }
    disconnectedCallback() {
      window.removeEventListener('keydown',  this._onKey);
      window.removeEventListener('resize',   this._onResize);
      window.removeEventListener('mousemove',this._onMouseMove);
      if (this._hideTimer) clearTimeout(this._hideTimer);
    }
    attributeChangedCallback() {
      if (this._canvas) {
        this._canvas.style.width  = this.designWidth  + 'px';
        this._canvas.style.height = this.designHeight + 'px';
        this._canvas.style.setProperty('--deck-design-w', this.designWidth  + 'px');
        this._canvas.style.setProperty('--deck-design-h', this.designHeight + 'px');
        this._fit(); this._syncPrintPageRule();
      }
    }

    _render() {
      const style = document.createElement('style');
      style.textContent = stylesheet;
      const stage  = document.createElement('div'); stage.className  = 'stage';
      const canvas = document.createElement('div'); canvas.className = 'canvas';
      canvas.style.width  = this.designWidth  + 'px';
      canvas.style.height = this.designHeight + 'px';
      canvas.style.setProperty('--deck-design-w', this.designWidth  + 'px');
      canvas.style.setProperty('--deck-design-h', this.designHeight + 'px');
      const slot = document.createElement('slot');
      slot.addEventListener('slotchange', this._onSlotChange);
      canvas.appendChild(slot); stage.appendChild(canvas);

      const tapzones = document.createElement('div');
      tapzones.className = 'tapzones'; tapzones.setAttribute('aria-hidden','true');
      const tzBack = document.createElement('div'); tzBack.className = 'tapzone tapzone--back';
      const tzMid  = document.createElement('div'); tzMid.className  = 'tapzone';
      tzMid.style.pointerEvents = 'none';
      const tzFwd  = document.createElement('div'); tzFwd.className  = 'tapzone tapzone--fwd';
      tzBack.addEventListener('click', () => this._go(this._index - 1, 'tap'));
      tzFwd.addEventListener('click',  () => this._go(this._index + 1, 'tap'));
      tapzones.append(tzBack, tzMid, tzFwd);

      const overlay = document.createElement('div');
      overlay.className = 'overlay';
      overlay.setAttribute('role','toolbar');
      overlay.innerHTML = `
        <button class="btn prev" type="button" aria-label="Previous">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"/></svg>
        </button>
        <span class="count"><span class="current">1</span><span class="sep">/</span><span class="total">1</span></span>
        <button class="btn next" type="button" aria-label="Next">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg>
        </button>
        <span class="divider"></span>
        <button class="btn reset" type="button">Reset<span class="kbd">R</span></button>
        <span class="divider"></span>
        <button class="btn grid-toggle" type="button" aria-label="All slides (G)">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="1.5" y="1.5" width="5" height="5" rx="1"/><rect x="9.5" y="1.5" width="5" height="5" rx="1"/>
            <rect x="1.5" y="9.5" width="5" height="5" rx="1"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/>
          </svg>
        </button>`;
      overlay.querySelector('.prev').addEventListener('click', () => this._go(this._index - 1, 'click'));
      overlay.querySelector('.next').addEventListener('click', () => this._go(this._index + 1, 'click'));
      overlay.querySelector('.reset').addEventListener('click', () => this._go(0, 'click'));
      overlay.querySelector('.grid-toggle').addEventListener('click', () => this.toggleFilmstrip());

      this._root.append(style, stage, tapzones, overlay);
      this._canvas  = canvas; this._slot = slot; this._overlay = overlay;
      this._countEl = overlay.querySelector('.current');
      this._totalEl = overlay.querySelector('.total');
    }

    _syncPrintPageRule() {
      const id = 'deck-stage-print-page';
      let tag = document.getElementById(id);
      if (!tag) { tag = document.createElement('style'); tag.id = id; document.head.appendChild(tag); }
      tag.textContent = '@page{size:'+this.designWidth+'px '+this.designHeight+'px;margin:0;}@media print{html,body{margin:0!important;padding:0!important;background:none!important;overflow:visible!important;height:auto!important;}*{-webkit-print-color-adjust:exact;print-color-adjust:exact;}}';
    }

    _onSlotChange() {
      this._collectSlides();
      this._restoreIndex();
      this._applyIndex({ showOverlay:false, reason:'init' });
      this._fit();
    }

    _collectSlides() {
      const assigned = this._slot.assignedElements({ flatten:true });
      this._slides = assigned.filter(el => !['TEMPLATE','SCRIPT','STYLE'].includes(el.tagName));
      this._slides.forEach((slide, i) => {
        let label = slide.getAttribute('data-label');
        if (!label) { const h = slide.querySelector('h1,h2,h3,[data-title]'); if (h) label = (h.textContent||'').trim().slice(0,40); }
        if (!label) label = 'Slide';
        slide.setAttribute('data-screen-label', `${pad2(i+1)} ${label}`);
        slide.setAttribute('data-deck-slide', String(i));
      });
      if (this._totalEl) this._totalEl.textContent = String(this._slides.length || 1);
      if (this._index >= this._slides.length) this._index = Math.max(0, this._slides.length - 1);
    }

    _restoreIndex() {
      try { const raw = localStorage.getItem(this._storageKey); if (raw != null) { const n = parseInt(raw,10); if (Number.isFinite(n) && n >= 0 && n < this._slides.length) this._index = n; } } catch(e) {}
    }
    _persistIndex() { try { localStorage.setItem(this._storageKey, String(this._index)); } catch(e) {} }

    _applyIndex({ showOverlay=true, reason='init' } = {}) {
      if (!this._slides.length) return;
      const curr = this._index;
      this._slides.forEach((s,i) => { if (i===curr) s.setAttribute('data-deck-active',''); else s.removeAttribute('data-deck-active'); });
      if (this._countEl) this._countEl.textContent = String(curr + 1);
      this._persistIndex();
      try { window.postMessage({ slideIndexChanged: curr }, '*'); } catch(e) {}
      this.dispatchEvent(new CustomEvent('slidechange', { detail:{ index:curr, total:this._slides.length, reason }, bubbles:true, composed:true }));
      if (showOverlay) this._flashOverlay();
      this._syncFilmstripActive();
    }

    _flashOverlay() {
      if (!this._overlay) return;
      this._overlay.setAttribute('data-visible','');
      if (this._hideTimer) clearTimeout(this._hideTimer);
      this._hideTimer = setTimeout(() => this._overlay.removeAttribute('data-visible'), OVERLAY_HIDE_MS);
    }

    _fit() {
      if (!this._canvas) return;
      if (this.hasAttribute('noscale')) { this._canvas.style.transform = 'none'; return; }
      const s = Math.min(window.innerWidth / this.designWidth, window.innerHeight / this.designHeight);
      this._canvas.style.transform = `scale(${s})`;
    }

    _onResize()    { this._fit(); }
    _onMouseMove() { this._flashOverlay(); }

    _onKey(e) {
      const t = e.target;
      if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const key = e.key; let handled = true;
      if (key==='ArrowRight'||key==='PageDown'||key===' '||key==='Spacebar') this._go(this._index+1,'keyboard');
      else if (key==='ArrowLeft'||key==='PageUp') this._go(this._index-1,'keyboard');
      else if (key==='Home') this._go(0,'keyboard');
      else if (key==='End')  this._go(this._slides.length-1,'keyboard');
      else if (key==='r'||key==='R') this._go(0,'keyboard');
      else if (key==='g'||key==='G') this.toggleFilmstrip();
      else if (/^[0-9]$/.test(key)) { const n = key==='0'?9:parseInt(key,10)-1; if (n<this._slides.length) this._go(n,'keyboard'); }
      else handled = false;
      if (handled) { e.preventDefault(); if (key!=='g'&&key!=='G') this._flashOverlay(); }
    }

    _go(i, reason='api') {
      if (!this._slides.length) return;
      const clamped = Math.max(0, Math.min(this._slides.length-1, i));
      if (clamped === this._index) { this._flashOverlay(); return; }
      this._index = clamped;
      this._applyIndex({ showOverlay:true, reason });
    }

    /* ── Filmstrip ── */
    _buildFilmstrip() {
      if (this._filmstripOverlay) return;
      if (!document.getElementById('ds-fs-style')) {
        const s = document.createElement('style'); s.id = 'ds-fs-style';
        s.textContent = `
          .ds-fs-overlay{position:fixed;inset:0;z-index:2147483500;pointer-events:none;opacity:0;transition:opacity 280ms ease;}
          .ds-fs-overlay.open{pointer-events:auto;opacity:1;}
          .ds-fs-backdrop{position:absolute;inset:0;background:rgba(0,0,0,0.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
          .ds-fs-drawer{position:absolute;right:0;top:0;bottom:0;width:420px;background:#111;overflow-y:auto;overflow-x:hidden;transform:translateX(100%);transition:transform 300ms cubic-bezier(.22,.9,.3,1);padding:24px 16px 40px;box-sizing:border-box;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,0.15) transparent;}
          .ds-fs-overlay.open .ds-fs-drawer{transform:translateX(0);}
          .ds-fs-header{display:flex;align-items:center;justify-content:space-between;margin:0 4px 18px;}
          .ds-fs-title{color:rgba(255,255,255,0.45);font-size:11px;font-family:-apple-system,sans-serif;letter-spacing:0.08em;text-transform:uppercase;font-weight:600;margin:0;}
          .ds-fs-close{appearance:none;background:rgba(255,255,255,0.08);border:0;margin:0;color:rgba(255,255,255,0.5);width:24px;height:24px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;}
          .ds-fs-close svg{width:12px;height:12px;display:block;}
          .ds-fs-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
          .ds-fs-thumb{cursor:pointer;border-radius:5px;overflow:hidden;position:relative;border:2px solid transparent;transition:border-color 160ms,transform 120ms;}
          .ds-fs-thumb:hover{transform:scale(1.03);border-color:rgba(255,255,255,0.35);}
          .ds-fs-thumb.ds-active{border-color:#c9973a;}
          .ds-fs-inner{width:100%;aspect-ratio:16/9;overflow:hidden;position:relative;background:#222;}
          .ds-fs-inner>.ds-clone{position:absolute!important;top:0!important;left:0!important;transform-origin:top left!important;pointer-events:none!important;visibility:visible!important;opacity:1!important;}
          .ds-fs-num{position:absolute;top:5px;left:7px;color:rgba(255,255,255,0.55);font-family:ui-monospace,monospace;font-size:9px;font-weight:600;z-index:2;}
          .ds-fs-label{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,0.72));color:rgba(255,255,255,0.85);font-family:-apple-system,sans-serif;font-size:9px;font-weight:500;padding:14px 7px 5px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:2;}`;
        document.head.appendChild(s);
      }
      const overlay  = document.createElement('div'); overlay.className = 'ds-fs-overlay';
      const backdrop = document.createElement('div'); backdrop.className = 'ds-fs-backdrop';
      backdrop.addEventListener('click', () => this._closeFilmstrip());
      const drawer  = document.createElement('div'); drawer.className = 'ds-fs-drawer';
      const header  = document.createElement('div'); header.className = 'ds-fs-header';
      const titleEl = document.createElement('p');   titleEl.className = 'ds-fs-title'; titleEl.textContent = `All Slides · ${this._slides.length}`;
      const closeBtn = document.createElement('button'); closeBtn.className = 'ds-fs-close'; closeBtn.type = 'button';
      closeBtn.innerHTML = `<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M1 1l10 10M11 1L1 11"/></svg>`;
      closeBtn.addEventListener('click', () => this._closeFilmstrip());
      header.append(titleEl, closeBtn);
      const grid = document.createElement('div'); grid.className = 'ds-fs-grid';
      this._filmstripThumbs = [];
      this._slides.forEach((slide, i) => {
        const thumb = document.createElement('div');
        thumb.className = 'ds-fs-thumb' + (i===this._index?' ds-active':'');
        const inner = document.createElement('div'); inner.className = 'ds-fs-inner';
        const clone = slide.cloneNode(true); clone.className = 'ds-clone';
        clone.removeAttribute('data-deck-active'); clone.style.cssText='';
        clone.style.pointerEvents='none'; clone.style.visibility='visible'; clone.style.opacity='1';
        inner.appendChild(clone);
        const num = document.createElement('span'); num.className = 'ds-fs-num'; num.textContent = String(i+1).padStart(2,'0');
        const rawLabel = slide.getAttribute('data-screen-label')||'';
        const labelText = rawLabel.replace(/^\d+\s*/,'').trim();
        if (labelText) { const lbl = document.createElement('div'); lbl.className = 'ds-fs-label'; lbl.textContent = labelText; inner.appendChild(lbl); }
        inner.appendChild(num); thumb.appendChild(inner);
        thumb.addEventListener('click', () => { this._go(i,'click'); this._closeFilmstrip(); });
        grid.appendChild(thumb); this._filmstripThumbs.push({ thumb, clone, inner });
      });
      drawer.append(header, grid); overlay.append(backdrop, drawer); document.body.appendChild(overlay);
      this._filmstripOverlay = overlay;
      requestAnimationFrame(() => {
        this._filmstripThumbs.forEach(({ clone, inner }) => {
          const w = inner.offsetWidth; if (!w) return;
          const scale = w / this.designWidth;
          clone.style.width = this.designWidth+'px'; clone.style.height = this.designHeight+'px';
          clone.style.transform = `scale(${scale})`;
        });
      });
    }

    _openFilmstrip() {
      this._buildFilmstrip();
      this._filmstripThumbs?.forEach(({ thumb }, i) => thumb.classList.toggle('ds-active', i===this._index));
      requestAnimationFrame(() => this._filmstripOverlay.classList.add('open'));
    }
    _closeFilmstrip()     { this._filmstripOverlay?.classList.remove('open'); }
    _syncFilmstripActive(){ this._filmstripThumbs?.forEach(({ thumb }, i) => thumb.classList.toggle('ds-active', i===this._index)); }

    get index()  { return this._index; }
    get length() { return this._slides.length; }
    goTo(i) { this._go(i,'api'); }
    next()  { this._go(this._index+1,'api'); }
    prev()  { this._go(this._index-1,'api'); }
    reset() { this._go(0,'api'); }
    toggleFilmstrip() {
      if (this._filmstripOverlay?.classList.contains('open')) this._closeFilmstrip();
      else this._openFilmstrip();
    }
  }

  if (!customElements.get('deck-stage')) customElements.define('deck-stage', DeckStage);
})();
</script>

<script>
// Theme toggle
const html = document.documentElement;
const savedTheme = localStorage.getItem('deck:theme') || 'light';
html.setAttribute('data-theme', savedTheme);
function syncTheme(t) { document.querySelectorAll('[data-theme-set]').forEach(b => b.classList.toggle('active', b.dataset.themeSet === t)); }
syncTheme(savedTheme);
document.querySelectorAll('[data-theme-set]').forEach(b => {
  b.addEventListener('click', () => { const t = b.dataset.themeSet; html.setAttribute('data-theme', t); localStorage.setItem('deck:theme', t); syncTheme(t); });
});
// Filmstrip button
document.getElementById('btn-filmstrip').addEventListener('click', () => document.getElementById('deck').toggleFilmstrip());
// Re-fit after fonts load
document.fonts.ready.then(() => { const d = document.getElementById('deck'); if (d && d._fit) d._fit(); });
</script>

</body>
</html>
